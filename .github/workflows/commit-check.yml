name: Commit Issue_ID Check

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  commit-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Issue_ID in commit message
        run: |
          echo "🔎 Checking commit message..."

          ISSUE_REGEX="Issue_ID: gh-[0-9]+"

          COMMIT_SHA=${{ github.sha }}
          MESSAGE=$(git show -s --format=%B $COMMIT_SHA)

          echo "Commit SHA: $COMMIT_SHA"
          echo "--------------------------------"
          echo "Commit message:"
          echo "$MESSAGE"
          echo "--------------------------------"

          if [[ $MESSAGE =~ $ISSUE_REGEX ]]; then
            echo "✅ Valid Issue_ID found"
          else
            echo "❌ Commit message must contain: Issue_ID: gh-<number>"
            exit 1
          fi
